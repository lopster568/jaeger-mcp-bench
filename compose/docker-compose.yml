version: "3.8"

# Jaeger v2 (with built-in OTel collector + spanmetrics) + hotrod + Prometheus,
# plus flatserver: arm 2's "flat" MCP arm (see docs/arm2-design.md). Jaeger's
# own built-in MCP server (the "tiered" arm) is enabled in-process via
# ai.enable_mcp in jaeger-config.yml - no separate container needed for it.
# Configured so spanmetrics flow into Prometheus, then back to Jaeger's metrics API.
#
# Bring up: docker-compose up -d
# Tear down: docker-compose down -v
#
# Health check after up: curl http://localhost:16686/api/services should show hotrod services
# Metrics check: curl 'http://localhost:16686/api/metrics/calls?service=frontend&endTs=...&lookback=300000&step=5000&ratePer=600000'
# Tiered MCP (in-process, arm "tiered"): http://localhost:16686/api/ai/mcp/
# Flat MCP (separate container, arm "flat"): http://localhost:8090/mcp

services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    ports:
      - "16686:16686"   # query UI / API / tiered MCP (/api/ai/mcp/)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # collector telemetry
    environment:
      - METRICS_STORAGE_TYPE=prometheus
      - PROMETHEUS_SERVER_URL=http://prometheus:9090
      - PROMETHEUS_QUERY_NORMALIZE_CALLS=true
      - PROMETHEUS_QUERY_NORMALIZE_DURATION=true
    volumes:
      - ./jaeger-config.yml:/etc/jaeger/config.yml:ro
    command: ["--config", "/etc/jaeger/config.yml"]
    depends_on:
      - prometheus
    networks:
      - bench

  flatserver:
    build:
      context: ../server
      dockerfile: flatserver/Dockerfile
    container_name: flatserver
    command: ["--jaeger-url=http://jaeger:16686", "--listen=0.0.0.0:8090"]
    # If a huge fetch ever OOMs the container mid-run, every later flat trial
    # would fail with connection errors and contaminate the arm - restart so
    # a crash costs one trial, not the rest of the run.
    restart: unless-stopped
    ports:
      - "8090:8090"     # flat arm MCP (/mcp)
    depends_on:
      - jaeger
    networks:
      - bench

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-admin-api"      # required for snapshots
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - bench

  hotrod:
    image: jaegertracing/example-hotrod:1.71.0
    container_name: hotrod
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=hotrod
    depends_on:
      - jaeger
    networks:
      - bench

networks:
  bench:
    driver: bridge

volumes:
  prometheus-data:
